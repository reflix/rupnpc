[package]
name = "rupnpc"
version = "0.1.4"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
pin-utils = "0.1"
rt-format = "0.3"
rupnp = { version = "3", features = ["full_device_spec"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
